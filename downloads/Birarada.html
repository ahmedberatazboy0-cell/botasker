<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111314" />
    <title>Birarada · Bu cihazda dene</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111314;
        --surface: #1a1d1f;
        --raised: #232729;
        --line: #303638;
        --text: #f4f0e9;
        --muted: #9da6a5;
        --accent: #ff9b69;
        --soft: #38271f;
        --danger: #ffa3a3;
        --green: #a5cab4;
        --radius: 22px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      button {
        border: 0;
        color: inherit;
        background: none;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      svg.icon {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(30px, 5vw, 44px);
        line-height: 1.13;
        letter-spacing: -1.6px;
      }
      h2 {
        font-size: 26px;
        letter-spacing: -0.8px;
        line-height: 1.25;
      }
      h3 {
        font-size: 17px;
        letter-spacing: -0.2px;
      }
      small,
      .small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .accent {
        color: var(--accent);
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 2.1px;
        font-weight: 750;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 18px;
      }
      .space {
        height: 14px;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 16px 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        background: var(--accent);
        color: #271b15;
        padding: 12px 18px;
        border: 1px solid transparent;
        border-radius: 13px;
        font-weight: 700;
        font-size: 13px;
        min-height: 46px;
      }
      .btn.secondary {
        background: var(--surface);
        color: var(--text);
        border-color: var(--line);
      }
      .btn.subtle {
        background: transparent;
        color: var(--muted);
        border-color: var(--line);
      }
      .btn.small {
        min-height: 36px;
        padding: 7px 12px;
        font-size: 12px;
      }
      .btn.danger {
        color: var(--danger);
        border-color: #663d3d;
        background: #291f20;
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        padding: 10px;
        border-radius: 12px;
        color: var(--muted);
        min-height: 42px;
        min-width: 42px;
        position: relative;
      }
      .icon-btn:hover {
        background: var(--surface);
        color: var(--text);
      }
      .badge {
        position: absolute;
        right: 4px;
        top: 3px;
        min-width: 15px;
        height: 15px;
        border-radius: 20px;
        background: var(--accent);
        color: #221711;
        font-size: 9px;
        display: grid;
        place-items: center;
        border: 2px solid var(--bg);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 30px;
        color: var(--muted);
        font-size: 11px;
      }
      .pill:before {
        content: "";
        width: 5px;
        height: 5px;
        background: var(--green);
        border-radius: 50%;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 23px;
      }
      .field {
        display: grid;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
      }
      input:not([type="checkbox"]),
      textarea,
      select {
        width: 100%;
        min-width: 0;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 13px 15px;
        outline: none;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
      }
      textarea {
        resize: vertical;
        min-height: 110px;
      }
      input::placeholder,
      textarea::placeholder {
        color: #758080;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
        flex-shrink: 0;
      }
      .check {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid var(--line);
        padding: 13px 0;
        font-size: 13px;
      }
      .check:last-child {
        border: 0;
      }
      .field-help {
        font-size: 11px;
        color: var(--muted);
      }
      .empty {
        padding: 48px 22px;
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      .empty .icon {
        width: 38px;
        height: 38px;
        color: var(--accent);
      }
      .empty p {
        max-width: 330px;
        color: var(--muted);
        font-size: 13px;
      }
      .avatar {
        display: inline-grid;
        place-items: center;
        background: var(--avatar, #4c5147);
        color: #f6f1e8;
        font-weight: 650;
        font-size: 15px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        flex-shrink: 0;
        overflow: hidden;
        letter-spacing: -0.5px;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar.lg {
        width: 82px;
        height: 82px;
        font-size: 29px;
      }
      .avatar.sm {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 23px;
        font-weight: 780;
        letter-spacing: -1px;
      }
      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        width: 30px;
        height: 30px;
      }
      .brand-mark svg {
        width: 31px;
        height: 31px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
      }
      .auth {
        max-width: 1160px;
        min-height: 100dvh;
        margin: auto;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        align-items: center;
        gap: 95px;
        padding: 50px;
      }
      .auth-hero {
        display: grid;
        gap: 35px;
      }
      .hero-art {
        height: 330px;
        position: relative;
        overflow: hidden;
        border-radius: 90px 90px 22px 22px;
        background: #252c2b;
        border: 1px solid #36403a;
      }
      .hero-art .sun {
        position: absolute;
        width: 148px;
        height: 148px;
        left: calc(50% - 74px);
        top: 42px;
        border-radius: 50%;
        background: #f6a577;
      }
      .hero-art .hill {
        position: absolute;
        border: 1px solid #68705b;
        width: 120%;
        height: 230px;
        border-radius: 50%;
        left: -40%;
        bottom: -90px;
        background: #3e4c40;
        transform: rotate(-15deg);
      }
      .hero-art .hill.two {
        left: 35%;
        bottom: -60px;
        background: #263b35;
        border-color: #526052;
        transform: rotate(12deg);
      }
      .hero-art .path {
        position: absolute;
        width: 1px;
        height: 220px;
        background: #c6b590;
        bottom: -70px;
        left: 53%;
        transform: rotate(-35deg);
      }
      .hero-art .caption {
        position: absolute;
        bottom: 24px;
        left: 24px;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #d8ddc8;
      }
      .hero-copy {
        max-width: 400px;
      }
      .hero-copy h1 {
        font-size: 48px;
      }
      .hero-copy h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .hero-copy p {
        margin-top: 15px;
        font-size: 14px;
        color: var(--muted);
        max-width: 350px;
      }
      .auth-panel {
        display: grid;
        gap: 22px;
        max-width: 400px;
        width: 100%;
      }
      .auth-panel form {
        display: grid;
        gap: 15px;
      }
      .auth-panel h2 {
        font-size: 31px;
      }
      .local-note {
        border-left: 2px solid var(--accent);
        padding-left: 12px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .form-error {
        color: var(--danger);
        font-size: 12px;
        min-height: 0;
      }
      .app-shell {
        max-width: 1420px;
        margin: auto;
        display: grid;
        grid-template-columns: 226px minmax(0, 670px) minmax(225px, 290px);
        gap: 36px;
        padding: 0 34px;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100dvh;
        padding: 36px 0 24px;
        display: flex;
        flex-direction: column;
      }
      .sidebar .brand {
        padding-left: 12px;
        margin-bottom: 42px;
      }
      .side-nav {
        display: grid;
        gap: 7px;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        width: 100%;
        font-size: 13px;
        color: var(--muted);
        text-align: left;
      }
      .nav-btn.active {
        background: var(--soft);
        color: var(--accent);
      }
      .nav-btn:hover {
        background: var(--surface);
      }
      .side-bottom {
        margin-top: auto;
        display: grid;
        gap: 18px;
      }
      .self-card {
        padding: 16px 10px;
        border-top: 1px solid var(--line);
      }
      .main {
        min-width: 0;
        padding-bottom: 50px;
      }
      .topbar {
        height: 98px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid var(--line);
      }
      .topbar .mobile-brand {
        display: none;
      }
      .topbar-title {
        font-size: 13px;
        color: var(--muted);
      }
      .topbar-actions {
        display: flex;
        gap: 8px;
      }
      .content {
        padding-top: 26px;
      }
      .page-intro {
        margin-bottom: 25px;
        display: grid;
        gap: 8px;
      }
      .page-intro .eyebrow {
        color: var(--accent);
      }
      .page-intro p {
        font-size: 13px;
        color: var(--muted);
      }
      .rail {
        position: sticky;
        top: 0;
        height: 100dvh;
        padding: 36px 0;
        display: grid;
        align-content: start;
        gap: 25px;
      }
      .rail-card {
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }
      .rail-person {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 0;
      }
      .rail-person > button:first-child {
        display: flex;
        align-items: center;
        gap: 11px;
        flex: 1;
        text-align: left;
        min-width: 0;
      }
      .rail small {
        font-size: 11px;
      }
      .rail .brand {
        font-size: 14px;
      }
      .rail footer {
        font-size: 10px;
        line-height: 1.9;
        color: #727d7b;
      }
      .stories {
        display: flex;
        gap: 19px;
        overflow-x: auto;
        padding: 4px 0 23px;
        scrollbar-width: none;
      }
      .story {
        display: grid;
        justify-items: center;
        gap: 8px;
        min-width: 62px;
        color: var(--muted);
        font-size: 10px;
      }
      .story-ring {
        border: 1.5px solid var(--accent);
        padding: 4px;
        border-radius: 50%;
        position: relative;
      }
      .story-ring .avatar {
        width: 48px;
        height: 48px;
        font-size: 18px;
      }
      .story-ring.own {
        border-style: dashed;
        border-color: #586260;
      }
      .story-plus {
        position: absolute;
        right: -2px;
        bottom: -2px;
        color: #261810;
        background: var(--accent);
        border: 3px solid var(--bg);
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        font-size: 17px;
      }
      .feed-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin: 10px 0 18px;
        color: var(--muted);
        font-size: 11px;
      }
      .post {
        margin-bottom: 22px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .post-head {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 17px 20px;
      }
      .post-user {
        flex: 1;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }
      .post-user strong {
        font-size: 13px;
        font-weight: 650;
      }
      .post-user small {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      .post-media {
        position: relative;
        width: 100%;
        background: #27322e;
        overflow: hidden;
      }
      .post-media img {
        width: 100%;
        display: block;
        aspect-ratio: 1.24;
        object-fit: cover;
      }
      .post-media video {
        width: 100%;
        display: block;
        max-height: 560px;
        background: #000;
      }
      .media-label {
        position: absolute;
        left: 16px;
        bottom: 15px;
        background: #151b17b3;
        color: #e6e4d5;
        padding: 4px 9px;
        border-radius: 7px;
        font-size: 9px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        pointer-events: none;
      }
      .post-body {
        padding: 15px 20px 20px;
        display: grid;
        gap: 10px;
      }
      .post-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .action-button {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
        font-size: 11px;
        padding: 4px 0;
        min-height: 32px;
      }
      .action-button[aria-pressed="true"] {
        color: var(--accent);
      }
      .action-button[aria-pressed="true"] .heart {
        fill: var(--accent);
        stroke: var(--accent);
      }
      .post-caption {
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .post-caption strong {
        font-weight: 650;
        margin-right: 5px;
      }
      .post-preview {
        font-size: 11px;
        line-height: 1.7;
        color: var(--muted);
        text-align: left;
      }
      .text-post {
        padding: 8px 20px 0;
        font-size: 23px;
        line-height: 1.5;
        letter-spacing: -0.5px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .search {
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 15px;
        padding: 0 14px;
        gap: 6px;
      }
      .search input {
        background: none;
        border: 0;
        padding-left: 8px;
        outline: none;
      }
      .tabs {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        margin: 17px 0 21px;
        scrollbar-width: none;
      }
      .tab {
        padding: 8px 13px;
        border-radius: 20px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        border: 1px solid var(--line);
      }
      .tab.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #291b13;
      }
      .people {
        display: grid;
        gap: 10px;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .person .person-info {
        min-width: 0;
        flex: 1;
        text-align: left;
      }
      .person strong {
        font-size: 13px;
      }
      .person small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .explore-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }
      .grid-item {
        position: relative;
        aspect-ratio: 0.9;
        background: var(--surface);
        border-radius: 13px;
        overflow: hidden;
        padding: 0;
      }
      .grid-item img,
      .grid-item video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .grid-item .grid-text {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 13px;
        padding: 12px;
        overflow: hidden;
        word-break: break-word;
        background: #26322c;
      }
      .grid-item .grid-count {
        position: absolute;
        bottom: 8px;
        right: 9px;
        background: #0008;
        border-radius: 15px;
        padding: 1px 7px;
        font-size: 10px;
      }
      .profile-cover {
        height: 115px;
        position: relative;
        background: linear-gradient(120deg, #3b4232, #303c35 48%, #4a3329);
        border: 1px solid #424c40;
        border-radius: 20px;
        overflow: hidden;
      }
      .profile-cover:after {
        content: "";
        position: absolute;
        right: 22%;
        top: 30px;
        width: 95px;
        height: 95px;
        background: #c68762;
        border-radius: 50%;
        opacity: 0.5;
      }
      .profile-overview {
        padding: 0 16px;
        margin-top: -35px;
        position: relative;
        display: grid;
        gap: 14px;
      }
      .profile-overview > .avatar {
        border: 5px solid var(--bg);
      }
      .stats {
        display: flex;
        gap: 28px;
        padding: 12px 0;
      }
      .stats button {
        font-size: 11px;
        color: var(--muted);
        padding: 0;
      }
      .stats strong {
        font-size: 18px;
        color: var(--text);
        display: block;
        line-height: 1.3;
      }
      .profile-bio {
        font-size: 13px;
        max-width: 440px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .profile-tools {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .settings-list {
        display: grid;
        gap: 14px;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        text-align: left;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .settings-row:last-child {
        border: 0;
      }
      .settings-row small {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .notifications {
        display: grid;
        gap: 10px;
      }
      .notice {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 17px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 17px;
      }
      .notice.unread {
        border-left: 3px solid var(--accent);
      }
      .notice .notice-body {
        flex: 1;
        font-size: 12px;
      }
      .notice small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-top: 5px;
      }
      .chat-list {
        display: grid;
        gap: 8px;
      }
      .chat-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 17px 14px;
        border-radius: 17px;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .chat-row .chat-info {
        flex: 1;
        min-width: 0;
      }
      .chat-info p {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted);
        font-size: 12px;

            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
            r.onblocked = () => reject(Error("blocked"));
          });
          storageMode = "idb";
          return await new Promise((resolve, reject) => {
            const r = store.transaction("kv").objectStore("kv").get("state");
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
          });
        } catch {
          store = null;
          try {
            const raw = localStorage.getItem(DB_KEY);
            localStorage.setItem(DB_KEY + "_probe", "1");
            localStorage.removeItem(DB_KEY + "_probe");

            tx.onerror = () => reject(tx.error);

 : "Verilerin bu tarayıcıda kalır; dosyayı başka tarayıcıda açtığında aynı veriler görünmez."}</p><div class="settings-row"><span>Tema ve dil<small>Koyu tema · Türkçe</small></span>${I("leaf")}</div><button class="settings-row" data-action="reset-data"><span style="color:var(--danger)">Test verilerini sıfırla<small>Bu HTML’deki hesapları ve eklediklerini sil.</small></span>${I("arrow")}</button></div><button class="btn secondary" data-action="logout">${I("logout")} Çıkış yap</button></div>`;

      function render() {

        const scroll = window.scrollY;
        let body;
        switch (page) {
          case "explore":
            body = explorePage();
            break;
          case "create":
            body = createPage();
            break;
          case "profile":
            body = profilePage(pageArg || meId);
            break;
          case "videos":
            body = videosPage();
            break;
          case "notifications":
            body = notificationsPage();
            break;
          case "messages":

          case "chat":

          case "settings":

      function go(next, arg = null) {

      let videoObserver;
      function observeVideos() {
        videoObserver?.disconnect();
        const videos = document.querySelectorAll("[data-auto-video]");
        if (!videos.length) return;
        videoObserver = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (
                entry.isIntersecting &&
                entry.intersectionRatio > 0.7 &&
                !document.hidden
              ) {
                document.querySelectorAll("video").forEach((v) => {
                  if (v !== entry.target) v.pause();
                });
                entry.target.play().catch(() => {});
              } else entry.target.pause();
            }
          },
          { threshold: [0, 0.7] },
        );
        videos.forEach((v) => videoObserver.observe(v));
      }

        if (document.hidden)
          document.querySelectorAll("video").forEach((v) => v.pause());

      async function openChat(cid) {
        const c = data.chats.find(
          (c) => c.id === cid && c.members.includes(meId),
        );

        const other = c.members.find((x) => x !== meId);
        if (blocked(meId, other)) throw Error("Bu sohbet engellenmiş.");
        await change(
          () =>
            c.messages.forEach((m) => {
              if (!m.seen.includes(meId)) m.seen.push(meId);

          "",
          false,

        go("chat", cid);
      }
      function chatFor(uid) {
        let c = data.chats.find(
          (c) =>
            c.members.length === 2 &&
            c.members.includes(uid) &&
            c.members.includes(meId),

          c = { id: id(), members: [meId, uid], messages: [], pinned: [] };
          data.chats.push(c);

        return c;

      async function sendLocal(uid, text) {

        await change(
          () => {
            const c = chatFor(uid);
            cid = c.id;

              id: id(),
              from: meId,
              text: text.trim().slice(0, 2000),
              at: Date.now(),

          "",

      async function followUser(uid) {

          removed = false;

          () => {
            const existing = relation(uid);
            if (existing) {
              data.follows = data.follows.filter((f) => f !== existing);
              removed = true;

              pending = user(uid).private;
              data.follows.push({
                from: meId,
                to: uid,
                status: pending ? "pending" : "accepted",
              });

                "follow",

            }
          },
          removed
            ? ""
            : pending

      async function likePost(pid, onlyAdd = false) {
        const p = data.posts.find((p) => p.id === pid && visible(p));
        if (!p) throw Error("Gönderiye erişilemiyor.");
        const liked = p.likes.includes(meId);

      async function prepareMedia(file) {
        if (!file) return null;
        const video = ["video/mp4", "video/webm", "video/ogg"].includes(
            file.type,
          ),
          image = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif",
          ].includes(file.type);
        if (!video && !image)
          throw Error("JPG, PNG, WebP, GIF veya MP4/WebM/OGG dosyası seç.");
        if (file.size > (video ? 16 : 12) * 1024 * 1024)
          throw Error(
            video
              ? "Video en fazla 16 MB olabilir."
              : "Fotoğraf en fazla 12 MB olabilir.",
          );
        if (video) {
          const probe = document.createElement("video");
          if (!probe.canPlayType(file.type))
            throw Error(
              "Bu tarayıcı video biçimini desteklemiyor. MP4 (H.264) veya WebM dene.",
            );
          const probeURL = URL.createObjectURL(file);
          try {
            await new Promise((resolve, reject) => {
              const timer = setTimeout(
                () =>
                  reject(
                    Error(
                      "Video açılamadı. Daha küçük bir MP4 veya WebM dene.",
                    ),
                  ),
                10000,
              );
              probe.preload = "metadata";
              probe.onloadedmetadata = () => {
                clearTimeout(timer);
                if (
                  !Number.isFinite(probe.duration) ||
                  probe.duration <= 0 ||
                  !probe.videoWidth
                )
                  reject(Error("Video dosyası okunamadı."));
                else resolve();
              };
              probe.onerror = () => {
                clearTimeout(timer);
                reject(
                  Error("Bu video açılamadı. MP4 (H.264) veya WebM dene."),
                );
              };
              probe.src = probeURL;
            });
          } finally {
            probe.removeAttribute("src");
            probe.load();
            URL.revokeObjectURL(probeURL);
          }
          return {
            type: "video",
            uri: await new Promise((resolve, reject) => {
              const r = new FileReader();
              r.onload = () => resolve(r.result);
              r.onerror = () => reject(Error("Video okunamadı."));
              r.readAsDataURL(file);
            }),
          };
        }
        const url = URL.createObjectURL(file);
        try {
          const img = new Image();
          img.src = url;
          await img.decode();
          if (!img.naturalWidth || !img.naturalHeight)
            throw Error("Fotoğraf okunamadı.");
          const scale = Math.min(
              1,
              1400 / img.naturalWidth,
              1400 / img.naturalHeight,
            ),
            canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
          canvas
            .getContext("2d")
            .drawImage(img, 0, 0, canvas.width, canvas.height);
          return { type: "image", uri: canvas.toDataURL("image/jpeg", 0.82) };
        } finally {
          URL.revokeObjectURL(url);
        }
      }
      async function hashPassword(password, salt = null) {
        if (!crypto.subtle)
          throw Error(
            "Bu tarayıcı yerel şifre kaydını desteklemiyor. Güncel Chrome veya Edge kullanabilir ya da örnek hesabı açabilirsin.",
          );
        const saltBytes = salt
          ? Uint8Array.from(atob(salt), (c) => c.charCodeAt(0))
          : crypto.getRandomValues(new Uint8Array(16));
        const key = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveBits"],
        );
        const bits = await crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt: saltBytes,
            iterations: 120000,
            hash: "SHA-256",
          },
          key,
          256,
        );
        return {
          salt: btoa(String.fromCharCode(...saltBytes)),
          hash: btoa(String.fromCharCode(...new Uint8Array(bits))),
        };
      }

      function storyOpen(uid, index = 0) {
        clearInterval(storyTimer);
        const list = data.stories.filter(

        );
        if (!list.length || index >= list.length) {
          closeModal();

        }

        storyState = { uid, index, list, start: Date.now() };
        dialog.innerHTML = `<div class="story-view">${s.media ? (s.type === "video" ? `<video class="story-media" src="${E(s.media)}" autoplay muted playsinline loop></video>` : `<img class="story-media" src="${E(s.media)}" alt="Anın görseli">`) : ""}<div class="story-shade"></div><div class="story-top"><div class="story-progress">${list.map((_, i) => `<span><i id="story-progress-${i}" style="width:${i < index ? "100%" : "0"}"></i></span>`).join("")}</div><div class="row">${avatar(u, "sm")}<span style="flex:1;font-size:12px;font-weight:650">${E(u.name)}<small style="display:block;color:#d2d9d4">${relative(s.at)}${s.closeOnly ? " · Yakınlar" : ""}</small></span><button class="icon-btn" style="color:white" data-action="close-modal" aria-label="Anı kapat">${I("close")}</button></div></div><div class="story-content">${E(s.text)}</div><div class="story-controls"><button class="btn small" data-action="story-prev" ${index === 0 ? "disabled" : ""}>${I("back")} Önceki</button>${uid === meId ? `<button class="btn small" data-action="story-views" data-id="${E(s.id)}">${s.views.length} görüntüleme</button>` : ""}<button class="btn small" data-action="story-next">Sonraki ${I("arrow")}</button></div>${uid !== meId && canMessage(uid) ? `<form id="story-reply" class="story-reply" data-id="${E(uid)}"><input name="text" placeholder="Bu An’a yanıt ver…" maxlength="500" required aria-label="An yanıtı"><button class="btn small" type="submit">${I("send")}</button></form>` : ""}</div>`;
        if (!dialog.open) dialog.showModal();
        if (uid !== meId && !s.views.includes(meId)) {
          change(() => s.views.push(meId), "", false).catch((e) =>
            toast(e.message),
          );
        }
        storyTimer = setInterval(() => {
          if (!storyState) return;
          const focused =
            dialog.contains(document.activeElement) &&
            document.activeElement.tagName === "INPUT";
          if (focused || document.hidden) {
            storyState.start += 100;
            return;
          }
          const progress = Math.min(1, (Date.now() - storyState.start) / 8000),
            bar = $("#story-progress-" + index);
          if (bar) bar.style.width = progress * 100 + "%";
          if (progress >= 1) storyOpen(uid, index + 1);
        }, 100);
      }

        },
        "story-views": (el) => {
          const s = data.stories.find(
            (s) => s.id === el.dataset.id && s.uid === meId,
          );
          if (s)
            modal(
              "Bu An’ı görenler",
              s.views.map((uid) => personRow(user(uid), false)).join("") ||
                '<p class="muted small">Henüz görüntülenmedi.</p>',
            );
        },
        refresh: () => {
          render();
          toast("Bu cihazdaki akış güncel.");
        },
        share: (el) => {
          const p = data.posts.find(
            (p) => p.id === el.dataset.id && visible(p),
          );
          if (!p) throw Error("Gönderi bulunamadı.");
          modal(
            "Bir anı paylaş",
            `<p class="muted small">Bu yerel gönderinin herkese açık bir bağlantısı yoktur. Açıklamayı kopyalayıp kendin paylaşabilirsin.</p><textarea id="share-text" readonly>${E("@" + user(p.uid)?.username + ": " + p.caption)}</textarea><button class="btn" data-action="copy-share">Metni kopyala</button>`,
          );
        },
        "copy-share": async () => {
          const input = $("#share-text");
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(input.value);
              toast("Metin kopyalandı.");
              return;
            } catch {}
          }
          input.focus();
          input.select();
          if (document.execCommand("copy")) toast("Metin kopyalandı.");
          else
            toast("Metin seçildi. Ctrl+C veya uzun basarak kopyalayabilirsin.");
        },
      };
      document.addEventListener("click", async (event) => {
        const el = event.target.closest("[data-action],[data-page]");
        if (!el || el.disabled) return;
        try {
          if (el.dataset.page) {
            closeModal();
            if (el.dataset.page === "profile") {
              profileTab = "posts";
              go("profile", meId);
            } else go(el.dataset.page);
            return;
          }
          const fn = actions[el.dataset.action];
          if (fn) {
            await fn(el, event);
            if (
              dialog.open &&
              ["profile", "open-post"].includes(el.dataset.action)
            )
              closeModal();
          }
        } catch (e) {
          toast(e.message || "İşlem tamamlanamadı.");
        }
      });
      document.addEventListener("dblclick", (event) => {
        const media = event.target.closest("[data-double-like]");
        if (media && !event.target.closest("video"))
          likePost(media.dataset.doubleLike, true).catch((e) =>
            toast(e.message),
          );
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "explore-search") {
          exploreSearch = event.target.value;
          $("#explore-results").innerHTML = exploreResults();
        }
      });
      document.addEventListener("change", async (event) => {
        if (event.target.id === "media-input") {
          const input = event.target,
            token = ++mediaGeneration;
          draftMedia = null;
          const button = $("#create-form button[type=submit]");
          if (button) button.disabled = true;
          try {
            toast("Medya bu cihazda hazırlanıyor…");
            const prepared = await prepareMedia(input.files[0]);
            if (
              token !== mediaGeneration ||
              page !== "create" ||
              !input.isConnected
            )
              return;
            draftMedia = prepared;
            const preview = $("#media-preview");
            if (preview) preview.innerHTML = draftMedia ? mediaPreview() : "";
            toast("Medya hazır.");
          } catch (e) {
            if (token !== mediaGeneration || !input.isConnected) return;
            draftMedia = null;
            input.value = "";
            const preview = $("#media-preview");
            if (preview) preview.innerHTML = "";
            toast(e.message);
          } finally {
            if (button?.isConnected && token === mediaGeneration)
              button.disabled = false;
          }
        }
      });
      document.addEventListener("submit", async (event) => {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;
        event.preventDefault();
        const button = form.querySelector("button[type=submit]");
        if (button) button.disabled = true;
        const values = new FormData(form),
          submittedBy = meId;
        const requireActive = () => {
          if (meId !== submittedBy || !form.isConnected)
            throw Error("Hesap veya ekran değişti; işlemi yeniden dene.");
        };
        try {
          if (form.id === "register-form") {
            const name = String(values.get("displayName")).trim(),
              username = String(values.get("username")).trim().toLowerCase(),
              email = String(values.get("email")).trim().toLowerCase(),
              password = String(values.get("password"));
            if (
              name.length < 2 ||
              !/^[a-z0-9_]{3,24}$/.test(username) ||
              password.length < 8
            )
              throw Error(
                "Adını, kullanıcı adını ve en az 8 karakterli şifreni kontrol et.",
              );
            if (
              data.users.some(
                (u) => u.email === email || u.username === username,
              )
            )
              throw Error(
                "Bu e-posta veya kullanıcı adı bu cihazda zaten kayıtlı.",
              );
            const credential = await hashPassword(password),
              uid = id();
            requireActive();
            await change(
              () =>
                data.users.push({
                  id: uid,
                  name,
                  username,
                  email,
                  credential,
                  bio: "",
                  website: "",
                  avatar: "",
                  private: true,
                  allowDM: false,
                  demo: false,
                  at: Date.now(),
                }),
              "",
              false,
            );
            setSession(uid);
            authError = "";
            go("feed");
            toast("Yerel test hesabın hazır. Hesabın varsayılan olarak gizli.");
          } else if (form.id === "login-form") {
            const email = String(values.get("email")).trim().toLowerCase(),
              u = data.users.find((u) => u.email === email);
            if (!u?.credential)
              throw Error(
                "Bu cihazdaki e-posta veya şifre eşleşmedi. Örnek hesaplar için “Örnek hesapla dene”yi kullan.",
              );
            const attempt = await hashPassword(
              String(values.get("password")),
              u.credential.salt,
            );
            requireActive();
            if (attempt.hash !== u.credential.hash)
              throw Error("E-posta veya şifre yanlış.");
            setSession(u.id);
            authError = "";
            go("feed");
          } else if (form.id === "create-form") {
            const caption = String(values.get("caption") || "").trim(),
              location = String(values.get("location") || "").trim();
            if (!caption && !draftMedia)
              throw Error("Bir açıklama veya medya ekle.");
            if (createKind === "video" && draftMedia?.type !== "video")
              throw Error("Kısa video için cihazından bir video seç.");
            const media = draftMedia,
              kind = createKind;
            await change(
              () => {
                if (kind === "story")
                  data.stories.unshift({
                    id: id(),
                    uid: meId,
                    media: media?.uri || "",
                    type: media?.type || "text",
                    text: caption,
                    closeOnly: values.get("closeOnly") === "on",
                    at: Date.now(),
                    views: [],
                  });
                else
                  data.posts.unshift({
                    id: id(),
                    uid: meId,
                    caption,
                    location,
                    media: media?.uri || "",
                    type: media?.type || "text",
                    likes: [],
                    saves: [],
                    comments: [],
                    at: Date.now(),
                    visibility: me().private ? "followers" : "public",
                    commentsEnabled: values.get("commentsEnabled") === "on",
                    hideLikes: values.get("hideLikes") === "on",
                    sample: false,
                  });
                delete data.drafts[meId];
              },
              "",
              false,
            );
            draftMedia = null;
            go(kind === "video" ? "videos" : "feed");
            toast(
              kind === "story"
                ? "Anın bu cihazda paylaşıldı."
                : "Paylaşımın bu cihazda kaydedildi.",
            );
          } else if (form.id === "comment-form") {
            const p = data.posts.find(
              (p) => p.id === form.dataset.post && visible(p),
            );
            if (!p?.commentsEnabled)
              throw Error("Bu gönderiye yorum yapılamıyor.");
            const text = String(values.get("text")).trim();
            if (!text) throw Error("Yorumunu yaz.");
            await change(
              () => {
                p.comments.push({
                  id: id(),
                  uid: meId,
                  text: text.slice(0, 1000),
                  at: Date.now(),
                });
                notify(p.uid, "comment", "gönderine yorum yaptı.", p.id);
              },
              "",
              false,
            );
            render();
            commentsModal(p.id);
          } else if (form.id === "profile-form") {
            const name = String(values.get("name")).trim(),
              username = String(values.get("username")).trim(),
              bio = String(values.get("bio") || ""),
              website = String(values.get("website") || "").trim();
            if (name.length < 2 || !/^[a-z0-9_]{3,24}$/.test(username))
              throw Error(
                "Kullanıcı adı küçük harf, rakam veya alt çizgi içermeli.",
              );
            if (
              data.users.some((u) => u.id !== meId && u.username === username)
            )
              throw Error("Bu kullanıcı adı alınmış.");
            if (website && !safeWebsite(website))
              throw Error("Web adresi http:// veya https:// ile başlamalı.");
            const file = $("#avatar-input").files[0],
              photo = file ? await prepareMedia(file) : null;
            if (photo && photo.type !== "image")
              throw Error("Profil fotoğrafı için bir görsel seç.");
            requireActive();
            await change(
              () =>
                Object.assign(me(), {
                  name,
                  username,
                  bio: bio.slice(0, 180),
                  website,
                  ...(photo ? { avatar: photo.uri } : {}),
                }),
              "",
              false,
            );
            closeModal();
            go("profile", meId);
            toast("Profilin güncellendi.");
          } else if (form.id === "message-form") {
            const c = data.chats.find(
              (c) => c.id === pageArg && c.members.includes(meId),
            );
            if (!c) throw Error("Sohbet bulunamadı.");
            const text = String(values.get("text")).trim();
            if (!text) throw Error("Mesajını yaz.");
            const other = c.members.find((x) => x !== meId);
            if (editingMessage) {
              if (!canMessage(other))
                throw Error("Bu hesaba mesaj gönderilemiyor.");
              await change(
                () => {
                  const m = c.messages.find(
                    (m) => m.id === editingMessage && m.from === meId,
                  );
                  if (!m) throw Error("Mesaj artık bulunamadı.");
                  m.text = text.slice(0, 2000);
                  m.edited = true;
                },
                "",
                false,
              );
              editingMessage = null;
            } else await sendLocal(other, text);
            render();
            $("#message-text")?.focus();
          } else if (form.id === "report-form") {
            await change(
              () =>
                data.reports.push({
                  id: id(),
                  from: meId,
                  target: form.dataset.id,
                  postId: form.dataset.post || null,
                  reason: String(values.get("reason")),
                  at: Date.now(),
                }),
              "",
              false,
            );
            closeModal();
            toast(
              "Şikâyet bu cihazda test kaydı olarak tutuldu; bir sunucuya gönderilmedi.",
            );
          } else if (form.id === "close-friends-form") {
            const members = values
              .getAll("members")
              .map(String)
              .filter(
                (uid) => user(uid) && uid !== meId && !blocked(meId, uid),
              );
            await change(
              () => {
                data.closeFriends[meId] = members;
              },
              "",
              false,
            );
            closeModal();
            toast("Yakınlar listen güncellendi.");
          } else if (form.id === "story-reply") {
            const uid = form.dataset.id,
              text = String(values.get("text")).trim();
            if (!text) throw Error("Yanıtını yaz.");
            await sendLocal(uid, "Anına yanıt: " + text);
            closeModal();
            toast("Yanıt bu cihazdaki sohbete eklendi.");
          }
        } catch (e) {
          if (["login-form", "register-form"].includes(form.id)) {
            authError = e.message;
            render();
          } else toast(e.message || "İşlem tamamlanamadı.");
        } finally {
          if (button?.isConnected) button.disabled = false;
        }
      });
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) {
          const rect = dialog.getBoundingClientRect();
          if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
          )
            closeModal();
        }
      });
      dialog.addEventListener("close", () => {
        clearInterval(storyTimer);
        storyState = null;
        dialog.querySelectorAll("video").forEach((v) => v.pause());
      });
      (async () => {
        try {
          const saved = await initStore();
          data =
            saved?.version === VERSION && Array.isArray(saved.users)
              ? saved
              : seed();
          if (!saved) {
            try {
              await persist();
            } catch {
              storageMode = "memory";
              store = null;
            }
          }
          meId = getSession();
          if (!user(meId)) setSession(null);
          render();
          if (storageMode === "memory")
            toast(
              "Tarayıcın kayıt izni vermiyor. Bu oturumdaki değişiklikler geçici olacak.",
            );
        } catch (e) {
          app.innerHTML = `<section class="auth"><div class="auth-panel">${brand()}<h2>Dosya açılamadı.</h2><p class="muted">Güncel Chrome veya Edge ile tekrar açmayı dene.</p><p class="form-error">${E(e.message)}</p></div></section>`;
        }
      })();
    </script>
  </body>
</html>
